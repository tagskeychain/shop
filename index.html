<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags - تحت الصيانة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .maintenance-container {
            max-width: 90%;
            width: 100%;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            margin: 20px 0;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 25px;
            color: white;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .logo span {
            color: #e74c3c;
        }
        
        .maintenance-icon {
            font-size: 4rem;
            margin-bottom: 25px;
            color: #f39c12;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #f39c12;
            line-height: 1.4;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ecf0f1;
        }
        
        .contact-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
        }
        
        .contact-info h3 {
            margin-bottom: 15px;
            color: #3498db;
        }
        
        .social-links {
            margin-top: 20px;
        }
        
        .social-links a {
            color: white;
            font-size: 1.5rem;
            margin: 0 10px;
            transition: color 0.3s, transform 0.3s;
            display: inline-block;
        }
        
        .social-links a:hover {
            color: #3498db;
            transform: translateY(-3px);
        }
        
        .countdown {
            margin-top: 25px;
            font-size: 1rem;
            color: #f1c40f;
        }
        
        /* تحسينات للشاشات الصغيرة (الهواتف) */
        @media (max-width: 768px) {
            .maintenance-container {
                padding: 25px 15px;
                max-width: 95%;
            }
            
            .logo {
                font-size: 2rem;
                margin-bottom: 20px;
            }
            
            .maintenance-icon {
                font-size: 3.5rem;
                margin-bottom: 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            .contact-info {
                padding: 15px;
            }
        }
        
        /* تحسينات إضافية للشاشات الصغيرة جداً */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .maintenance-container {
                padding: 20px 15px;
            }
            
            .logo {
                font-size: 1.8rem;
            }
            
            .maintenance-icon {
                font-size: 3rem;
            }
            
            h1 {
                font-size: 1.3rem;
            }
            
            p {
                font-size: 0.95rem;
            }
        }
        
        /* تحسينات للشاشات الكبيرة جداً */
        @media (min-width: 1200px) {
            .maintenance-container {
                max-width: 700px;
                padding: 40px;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            .maintenance-icon {
                font-size: 5rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="logo">T<span>ags</span></div>
        <div class="maintenance-icon">
            <i class="fas fa-tools"></i>
        </div>
        <h1>الموقع تحت الصيانة</h1>
        <p>نعمل حالياً على تحسين موقعنا لتقديم تجربة أفضل لكم. سنعود قريباً!</p>
        <p>نعتذر عن أي إزعاج قد يسببه هذا الأمر ونشكركم على صبركم.</p>
        
        <div class="contact-info">
            <h3>للتواصل معنا:</h3>
            <p><i class="fas fa-envelope"></i> tags.keychain@gmail.com</p>
            <div class="social-links">
                <a href="https://www.instagram.com/tags.keychain/" target="_blank" aria-label="انستجرام">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>
        
        <div class="countdown">
            <p>نحن نعمل بجد لإكمال الصيانة في أقرب وقت ممكن</p>
        </div>
    </div>
</body>
</html>
